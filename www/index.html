<!DOCTYPE html>
<html lang="pt-pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault-Master Secure</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --bg-color: #1a1a1e;
            --panel-color: #d1d9e6;
            --accent-color: #3498db;
            --lcd-bg: #0d0d0d;
            --lcd-text: #00ff41;
        }

        body {
            background: var(--bg-color);
            background-image:
                radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.05) 0%, transparent 80%),
                linear-gradient(45deg, #111 25%, transparent 25%, transparent 75%, #111 75%, #111),
                linear-gradient(45deg, #111 25%, transparent 25%, transparent 75%, #111 75%, #111);
            background-size: 100% 100%, 8px 8px, 8px 8px;
            background-position: 0 0, 0 0, 4px 4px;
            font-family: 'Inter', sans-serif;
            color: #333;
            overflow-x: hidden;
        }

        /* Main Panel - Brushed Metal / Industrial Look */
        .squeo-panel {
            background: var(--panel-color);
            background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, transparent 50%, rgba(0, 0, 0, 0.05) 100%);
            border-radius: 40px;
            padding: 50px;
            position: relative;
            box-shadow:
                20px 20px 60px #0a0a0c,
                -10px -10px 30px rgba(255, 255, 255, 0.1),
                inset 2px 2px 5px rgba(255, 255, 255, 0.5),
                inset -2px -2px 5px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .squeo-panel::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 2px solid rgba(0, 0, 0, 0.05);
            border-radius: 35px;
            pointer-events: none;
        }

        /* Screw Heads */
        .screw {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #aab2bd;
            border-radius: 50%;
            box-shadow: inset 1px 1px 2px rgba(0, 0, 0, 0.5), 1px 1px 2px rgba(255, 255, 255, 0.8);
        }

        .screw::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            width: 8px;
            height: 2px;
            background: rgba(0, 0, 0, 0.3);
        }

        .s-tl {
            top: 20px;
            left: 20px;
        }

        .s-tr {
            top: 20px;
            right: 20px;
        }

        .s-bl {
            bottom: 20px;
            left: 20px;
        }

        .s-br {
            bottom: 20px;
            right: 20px;
        }

        /* Buttons - Neomorphic / Tactile */
        .squeo-button {
            background: var(--panel-color);
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #444;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow:
                5px 5px 10px #b8bfca,
                -5px -5px 10px #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .squeo-button:hover {
            color: var(--accent-color);
            box-shadow:
                2px 2px 5px #b8bfca,
                -2px -2px 5px #ffffff;
        }

        .squeo-button:active {
            box-shadow:
                inset 4px 4px 8px #b8bfca,
                inset -4px -4px 8px #ffffff;
            transform: scale(0.98);
        }

        .squeo-button.danger {
            color: #e74c3c;
        }

        /* Inputs - Recessed */
        .squeo-input {
            background: #e0e5ec;
            border: none;
            padding: 16px;
            border-radius: 12px;
            width: 100%;
            box-shadow:
                inset 4px 4px 8px #b8bfca,
                inset -4px -4px 8px #ffffff;
            font-family: 'JetBrains Mono', monospace;
            color: #2c3e50;
            outline: none;
            transition: box-shadow 0.3s ease;
        }

        .squeo-input:focus {
            box-shadow:
                inset 2px 2px 4px #b8bfca,
                inset -2px -2px 4px #ffffff,
                0 0 0 2px var(--accent-color);
        }

        /* LCD Display */
        .lcd-container {
            background: #111;
            padding: 10px;
            border-radius: 15px;
            box-shadow:
                inset 3px 3px 10px rgba(0, 0, 0, 0.8),
                1px 1px 2px rgba(255, 255, 255, 0.4);
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .lcd-container::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        .lcd {
            background: var(--lcd-bg);
            color: var(--lcd-text);
            padding: 20px;
            border-radius: 8px;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 10px var(--lcd-text);
            text-align: center;
            font-size: 1.2rem;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #222;
        }

        /* Card Style */
        .card {
            background: var(--panel-color);
            border-radius: 20px;
            padding: 25px;
            box-shadow:
                8px 8px 16px #b8bfca,
                -8px -8px 16px #ffffff;
            transition: transform 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            font-weight: 800;
            font-size: 1.1rem;
            color: #2c3e50;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .card p {
            color: #7f8c8d;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
        }

        .hidden {
            display: none
        }

        /* Animations */
        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        .lcd-status {
            animation: blink 2s infinite;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-6">

    <div class="w-full max-w-4xl squeo-panel">
        <div class="screw s-tl"></div>
        <div class="screw s-tr"></div>
        <div class="screw s-bl"></div>
        <div class="screw s-br"></div>

        <header class="flex justify-between items-end mb-8 border-b-2 border-black/5 pb-4">
            <div>
                <h1 class="text-4xl font-black tracking-tighter text-gray-800">VAULT-MASTER</h1>
                <p class="text-[10px] uppercase tracking-[0.3em] font-bold text-gray-500">SISTEMA DE NÍVEL DE SEGURANÇA
                </p>
            </div>
            <div id="statusWrapper" class="text-right">
                <p id="status"
                    class="text-xs font-black px-3 py-1 rounded-full bg-red-500/10 text-red-600 border border-red-500/20">
                    BLOQUEADO</p>
                <div class="flex items-center justify-end gap-2 mt-1">
                    <p class="text-[9px] text-gray-400 uppercase font-bold">Versão 1.3.0</p>
                    <button onclick="checkUpdates(true)"
                        class="text-[9px] text-blue-500 hover:underline uppercase font-bold">Verificar</button>
                </div>
            </div>
        </header>

        <!-- SETUP -->
        <div id="setupView" class="hidden">
            <div class="lcd-container">
                <div class="lcd">
                    <span>CONFIGURAR CHAVE MESTRA</span>
                    <span style="font-size: 0.6em; opacity: 0.7; margin-top: 4px;">MÍNIMO 12 CARACTERES</span>
                </div>
            </div>
            <div class="max-w-md mx-auto">
                <input id="newPass" type="password" class="squeo-input mb-6" placeholder="••••••••••••">
                <button class="squeo-button w-full" onclick="setup()">
                    <span>INICIALIZAR SISTEMA</span>
                </button>
            </div>
        </div>

        <!-- LOGIN -->
        <div id="loginView" class="hidden">
            <div class="lcd-container">
                <div id="loginMsg" class="lcd">
                    <span>ACESSO AO SISTEMA</span>
                    <span class="text-xs opacity-60 mt-1">IDENTIFICAÇÃO NECESSÁRIA</span>
                </div>
            </div>
            <div class="max-w-md mx-auto">
                <input id="loginPass" type="password" class="squeo-input mb-6" placeholder="DIGITE O CÓDIGO DE ACESSO">
                <button class="squeo-button w-full" onclick="login()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                    <span>AUTENTICAR</span>
                </button>
                <p id="err"
                    class="text-red-600 text-center font-bold text-xs mt-6 px-4 py-2 bg-red-500/10 border border-red-500/20 rounded-lg hidden">
                    ACESSO NEGADO: CREDENCIAIS INVÁLIDAS</p>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div id="dashView" class="hidden">
            <div class="flex flex-col md:flex-row gap-4 mb-8">
                <div class="relative flex-1">
                    <input id="search" type="text" placeholder="Procurar senha..." class="squeo-input pl-10 w-full"
                        oninput="render()">
                    <svg class="absolute left-3 top-3 text-gray-400" xmlns="http://www.w3.org/2000/svg" width="18"
                        height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8" />
                        <path d="m21 21-4.3-4.3" />
                    </svg>
                </div>
                <select id="filterCategory" class="squeo-input md:w-48" onchange="render()">
                    <option value="">Todas Categorias</option>
                    <option value="Pessoal">Pessoal</option>
                    <option value="Trabalho">Trabalho</option>
                    <option value="Banco">Banco</option>
                    <option value="Redes Sociais">Redes Sociais</option>
                    <option value="Streaming">Streaming</option>
                </select>
                <button class="squeo-button" onclick="openModal()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14" />
                        <path d="M12 5v14" />
                    </svg>
                    NOVO
                </button>
                <button class="squeo-button danger" onclick="lock()">
                    BLOQUEAR
                </button>
            </div>
            <div id="grid" class="grid md:grid-cols-2 lg:grid-cols-2 gap-8"></div>
        </div>

    </div>

    <!-- MODAL -->
    <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-6"
        style="z-index: 100;">
        <div class="squeo-panel max-w-md w-full">
            <div class="lcd-container mb-6">
                <div class="lcd text-sm">CRIPTOGRAFAR NOVO REGISTRO</div>
            </div>
            <div class="space-y-4">
                <input id="site" placeholder="Serviço / Website (ex: google.com)" class="squeo-input">
                <select id="category" class="squeo-input">
                    <option value="Pessoal">Pessoal</option>
                    <option value="Trabalho">Trabalho</option>
                    <option value="Banco">Banco</option>
                    <option value="Redes Sociais">Redes Sociais</option>
                    <option value="Streaming">Streaming</option>
                </select>
                <input id="user" placeholder="Usuário / Email" class="squeo-input">
                <input id="pass" placeholder="Senha" class="squeo-input">
                <div class="flex gap-4 pt-4">
                    <button class="squeo-button flex-1" onclick="closeModal()">CANCELAR</button>
                    <button class="squeo-button flex-1 text-blue-600" onclick="save()">SALVAR</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Versão 2.1: Segurança Adaptativa e Categorias
        const META = "vault_meta_v2";
        const DATA = "vault_data_v2";

        // 600k Desktop / 350k Mobile (Evita ANR em Android low-end)
        const ITERS = (navigator.userAgent.includes('Android') || navigator.userAgent.includes('iPhone')) ? 350000 : 600000;

        let vaultKey = null, fails = 0, autoLockTimer = null;

        function resetTimer() {
            if (autoLockTimer) clearTimeout(autoLockTimer);
            if (vaultKey) {
                // Bloqueia após 5 minutos de inatividade
                autoLockTimer = setTimeout(() => {
                    console.log("Sistema bloqueado por inatividade");
                    lock();
                }, 5 * 60 * 1000);
            }
        }

        // Monitorar interação do usuário
        ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart'].forEach(name => {
            document.addEventListener(name, resetTimer, true);
        });

        /* UI Helpers */
        function updateStatus(isLocked) {
            const s = document.getElementById('status');
            if (isLocked) {
                s.innerText = "BLOQUEADO";
                s.className = "text-xs font-black px-3 py-1 rounded-full bg-red-500/10 text-red-600 border border-red-500/20";
            } else {
                s.innerText = "DESBLOQUEADO";
                s.className = "text-xs font-black px-3 py-1 rounded-full bg-green-500/10 text-green-600 border border-green-500/20";
            }
        }

        /* Buffer Helpers */
        function bufferToBase64(buf) {
            return btoa(String.fromCharCode(...new Uint8Array(buf)));
        }
        function base64ToBuffer(base64) {
            return new Uint8Array(atob(base64).split("").map(c => c.charCodeAt(0)));
        }

        /* INIT */
        window.onload = () => {
            try {
                localStorage.getItem(META) ? show('loginView') : show('setupView');
                checkUpdates();
            } catch (e) {
                console.error("Erro na Inicialização:", e);
                alert("Erro Crítico do Sistema: " + e.message);
            }
        };

        const APP_VERSION = "1.3.0";
        async function checkUpdates(manual = false) {
            try {
                if (manual) console.log("Verificação manual disparada...");
                const response = await fetch('https://api.github.com/repos/gamesouseila-max/family-senhas/releases/latest');

                if (!response.ok) {
                    if (manual) alert("Nenhuma versão nova encontrada no GitHub (Releases).");
                    return;
                }

                const data = await response.json();
                const latest = data.tag_name.replace('v', '');

                if (latest !== APP_VERSION) {
                    if (confirm(`Nova versão disponível (${latest})! Deseja baixar agora?`)) {
                        window.open('https://github.com/gamesouseila-max/family-senhas/releases/latest', '_blank');
                    }
                } else if (manual) {
                    alert("Você já está usando a última versão!");
                }
            } catch (e) {
                console.error("Erro ao verificar atualizações:", e);
                if (manual) alert("Erro ao conectar com GitHub.");
            }
        }

        function show(v) {
            const views = ['setupView', 'loginView', 'dashView'];
            views.forEach(x => {
                const el = document.getElementById(x);
                if (el) el.classList.add('hidden');
            });
            const target = document.getElementById(v);
            if (target) target.classList.remove('hidden');
        }

        /* CRYPTO */
        async function derive(pass, salt, use) {
            const enc = new TextEncoder();
            const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
            return crypto.subtle.deriveKey(
                { name: "PBKDF2", salt, iterations: ITERS, hash: "SHA-256" },
                base, { name: "AES-GCM", length: 256 }, true, use
            );
        }
        async function authHash(pass, salt) {
            const k = await derive(pass, salt, ["encrypt"]);
            const raw = await crypto.subtle.exportKey("raw", k);
            return bufferToBase64(raw);
        }

        /* SETUP */
        async function setup() {
            try {
                const passEl = document.getElementById('newPass');
                const p = passEl.value;
                if (!p || p.length < 12) {
                    return alert("Erro de Segurança: A frase de acesso deve ter pelo menos 12 caracteres.");
                }

                const salt = crypto.getRandomValues(new Uint8Array(16));
                const hash = await authHash(p, salt);

                localStorage.setItem(META, JSON.stringify({
                    salt: bufferToBase64(salt),
                    hash: hash
                }));

                passEl.value = "";
                show('loginView');
            } catch (e) {
                console.error("Erro de Configuração:", e);
                alert("Falha na Configuração: " + e.message);
            }
        }

        /* LOGIN */
        async function login() {
            try {
                const loginPassEl = document.getElementById('loginPass');
                const errEl = document.getElementById('err');
                const loginMsgEl = document.getElementById('loginMsg');

                const metaRaw = localStorage.getItem(META);
                if (!metaRaw) return show('setupView');

                const meta = JSON.parse(metaRaw);
                const salt = base64ToBuffer(meta.salt);

                const currentHash = await authHash(loginPassEl.value, salt);

                if (currentHash !== meta.hash) {
                    if (errEl) errEl.classList.remove('hidden');
                    if (loginMsgEl) loginMsgEl.innerHTML = "<span>ACESSO NEGADO</span><span class='text-red-500 text-xs mt-1'>FALHA NA VALIDAÇÃO</span>";
                    await new Promise(r => setTimeout(r, ++fails * 800));
                    return;
                }

                vaultKey = await derive(loginPassEl.value, salt, ["encrypt", "decrypt"]);
                loginPassEl.value = "";
                if (errEl) errEl.classList.add('hidden');
                updateStatus(false);
                resetTimer(); // Inicia timer de inatividade
                show('dashView');
                render();
            } catch (e) {
                console.error("Erro de Login:", e);
                alert("Falha na Autenticação: " + e.message);
            }
        }

        /* LOCK */
        function lock() {
            vaultKey = null;
            if (autoLockTimer) clearTimeout(autoLockTimer);
            updateStatus(true);
            show('loginView');
        }

        /* ENTRIES */
        async function save() {
            try {
                const siteEl = document.getElementById('site');
                const cateEl = document.getElementById('category');
                const userEl = document.getElementById('user');
                const passEl = document.getElementById('pass');

                const e = {
                    id: crypto.randomUUID(),
                    site: siteEl.value,
                    cate: cateEl.value,
                    user: userEl.value,
                    pass: passEl.value,
                    ts: Date.now()
                };

                resetTimer(); // Reset timer upon saving

                const iv = crypto.getRandomValues(new Uint8Array(12));
                const encodedData = new TextEncoder().encode(JSON.stringify(e));

                const enc = await crypto.subtle.encrypt(
                    { name: "AES-GCM", iv },
                    vaultKey,
                    encodedData
                );

                const dataRaw = localStorage.getItem(DATA) || "[]";
                const vault = JSON.parse(dataRaw);

                vault.push({
                    iv: bufferToBase64(iv),
                    data: bufferToBase64(enc)
                });

                localStorage.setItem(DATA, JSON.stringify(vault));
                closeModal();
                render();
            } catch (e) {
                console.error("Erro ao Salvar:", e);
                alert("Falha na Criptografia: " + e.message);
            }
        }

        async function decrypt(i) {
            try {
                const iv = base64ToBuffer(i.iv);
                const d = base64ToBuffer(i.data);
                const dec = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, vaultKey, d);
                return JSON.parse(new TextDecoder().decode(dec));
            } catch (e) {
                console.error("Erro na Descriptografia:", e);
                return null;
            }
        }

        async function render() {
            try {
                const gridEl = document.getElementById('grid');
                const searchVal = document.getElementById('search').value.toLowerCase();
                const filterVal = document.getElementById('filterCategory').value;
                if (!gridEl) return;

                gridEl.innerHTML = "";
                const dataRaw = localStorage.getItem(DATA) || "[]";
                const vault = JSON.parse(dataRaw);

                for (const i of vault) {
                    const e = await decrypt(i);
                    if (!e) continue;

                    // Filtros Profissionais
                    if (searchVal && !e.site.toLowerCase().includes(searchVal) && !e.user.toLowerCase().includes(searchVal)) continue;
                    if (filterVal && e.cate !== filterVal) continue;

                    const c = document.createElement('div');
                    c.className = "card";

                    // Lógica de ícone (Privacy First)
                    const iconColor = e.cate === 'Banco' ? 'bg-amber-100 text-amber-600' : 'bg-blue-100 text-blue-600';
                    const categoryIcon = `<div class="w-10 h-10 rounded-lg ${iconColor} flex items-center justify-center font-bold text-lg mb-4">${e.site[0].toUpperCase()}</div>`;

                    c.innerHTML = `
                        <div class="flex flex-col h-full">
                            <div class="flex justify-between items-start mb-2">
                                ${categoryIcon}
                                <span class="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-md bg-black/5 text-black/40">${e.cate || 'Geral'}</span>
                            </div>
                            <h3 class="mb-1 font-bold text-gray-800">${e.site}</h3>
                            <p class="mb-6 truncate text-sm text-gray-500">${e.user || "Usuário Anônimo"}</p>
                            <div class="mt-auto">
                                <button class="squeo-button w-full text-xs py-2" onclick="navigator.clipboard.writeText('${e.pass}')">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                                    <span>COPIAR SENHA</span>
                                </button>
                            </div>
                        </div>`;
                    gridEl.appendChild(c);
                }
            } catch (e) {
                console.error("Erro de Renderização:", e);
            }
        }

        /* MODAL */
        function openModal() {
            const el = document.getElementById('modal');
            if (el) el.classList.remove('hidden');
        }
        function closeModal() {
            const el = document.getElementById('modal');
            if (el) el.classList.add('hidden');
            document.getElementById('site').value = "";
            document.getElementById('user').value = "";
            document.getElementById('pass').value = "";
        }
    </script>
</body>

</html>
